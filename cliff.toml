[changelog]
header = "# Changelog\n\nAll notable changes to this project will be documented in this file.\n"
body = """

## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute=\"group\") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
# A squash body can list extra Conventional Commits, one per line. Splitting
# before parsing keeps them even when the subject's type is skipped.
split_commits = true
processing_order = ["commit_preprocessors", "split_commits", "conventional_commits", "commit_parsers", "link_parsers"]
# Only real release tags delimit versions; any future non-semver tag (nightly,
# markers) must not become a changelog range boundary.
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
commit_parsers = [
  # The HTML comments order the sections; the template strips them.
  { message = "^feat(\\([^)]*\\))?!?: ", group = "<!-- 0 -->Features" },
  { message = "^fix(\\([^)]*\\))?!?: ", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf(\\([^)]*\\))?!?: ", group = "<!-- 2 -->Performance" },
  { message = "^revert(\\([^)]*\\))?!?: ", group = "<!-- 3 -->Reverts" },
  { message = "^build(\\([^)]*\\))?!?: ", group = "<!-- 4 -->Build System" },
  # Every other line: hidden types (chore, ci, docs, refactor, style, test),
  # Dependabot "Bump" subjects, and PR-body prose.
  { message = ".*", skip = true },
]
