[workspace]
members = ["crates/stalelink-core", "crates/stalelink"]
exclude = ["bench/rust-harness"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jishnuteegala/stalelink"
description = "Find dead and outdated links in local documents"
homepage = "https://github.com/jishnuteegala/stalelink"
keywords = ["links", "link-checker", "documents", "cli"]
categories = ["command-line-utilities", "development-tools"]

# Config for 'dist'
[workspace.metadata.dist]
# Whether to consider the binaries in a package for distribution (defaults true)
dist = true
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# The generated installer is published as the unscoped `stalelink` npm package.
npm-package = "stalelink"
# cargo-dist owns release.yml. Custom entries below are reusable workflows.
host-jobs = ["./create-draft-release"]
publish-jobs = ["./publish-homebrew", "./publish-npm-oidc", "./publish-nfpm"]
post-announce-jobs = ["./publish-scoop", "./publish-aur", "./publish-winget"]
# cargo-dist's native Homebrew publisher writes this formula to the tap.
tap = "jishnuteegala/homebrew-tap"
formula = "stalelink"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# A custom host job creates the draft before core publishers; cargo-dist uploads
# artifacts and undrafts it in announce after those jobs complete.
create-release = false
github-release = "announce"
# Whether to enable GitHub Attestations
github-attestations = true
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

github-action-commits = { "actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803", "actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c", "actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a", "actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" }

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4.33"
linkify = "0.11.0"
html5tokenizer = "0.5.2"
pulldown-cmark = "0.13.4"
unicase = "2.9"
regex = "1.12"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5"
unicode-width = "0.2.2"
reqwest = { version = "0.13", default-features = true }
hyper = "1.11"
futures = "0.3"
httpdate = "1.0"
# Text extraction works without lopdf's optional image, font, and rayon support.
lopdf = { version = "0.39", default-features = false }
zip = { version = "7.2", default-features = false, features = ["deflate"] }
quick-xml = "0.39"
directories = "6"
figment = { version = "0.10", features = ["env", "toml"] }
humantime = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
similar = "2.7"
proptest = "1.6"
tempfile = "3"
html-escape = "0.2"
rookie = "0.5.6"
chromiumoxide = { version = "0.9.1", default-features = false }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
