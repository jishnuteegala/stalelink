[workspace]
members = ["crates/stalelink-core", "crates/stalelink"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jishnuteegala/stalelink"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4.33"
linkify = "0.11.0"
html5tokenizer = "0.5.2"
pulldown-cmark = "0.13.4"
regex = "1.12"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5"
unicode-width = "0.2.2"
lychee-lib = { version = "0.24.2", default-features = false }
reqwest = { version = "0.13", default-features = true }
futures = "0.3"
