name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  # Allows re-publishing a single channel without re-running the whole
  # release pipeline (which is not idempotent past announce).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-22.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.PACKAGES_GITHUB_TOKEN }}
        run: test -n "$TOKEN" && echo 'available=true' >> "$GITHUB_OUTPUT" || echo 'available=false' >> "$GITHUB_OUTPUT"
  prerelease-gate:
    uses: ./.github/workflows/prerelease-gate.yml
    with:
      plan: ${{ inputs.plan }}
      tag: ${{ inputs.tag }}
  publish:
    needs: [credentials, prerelease-gate]
    if: needs.credentials.outputs.available == 'true' && needs.prerelease-gate.outputs.allowed == 'true'
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || fromJson(inputs.plan).announcement_tag }}
      GH_TOKEN: ${{ secrets.PACKAGES_GITHUB_TOKEN }}
    steps:
      - name: Push cargo-dist-generated formula
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo jishnuteegala/stalelink --pattern stalelink.rb --dir .
          git clone "https://x-access-token:${GH_TOKEN}@github.com/jishnuteegala/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp stalelink.rb tap/Formula/stalelink.rb
          git -C tap config user.name github-actions[bot]
          git -C tap config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C tap add Formula/stalelink.rb
          git -C tap diff --cached --quiet || git -C tap commit -m "stalelink ${TAG#v}"
          git -C tap push
