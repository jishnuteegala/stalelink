name: Publish npm with OIDC

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@12.0.1
      - name: Verify generated package and publish provenance
        run: |
          set -euo pipefail
          mkdir package
          tar -xzf artifacts/stalelink-npm-package.tar.gz -C package
          test "$(node -p "require('./package/package.json').name")" = stalelink
          cd package/package
          set +e
          npm publish --provenance 2>&1 | tee "$RUNNER_TEMP/npm-publish.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q 'E404' "$RUNNER_TEMP/npm-publish.log"; then
              echo "::warning::npm trusted publishing is not configured; continuing the release without publishing stalelink to npm. Complete the bootstrap before the next release."
              exit 0
            fi
            exit "$status"
          fi
