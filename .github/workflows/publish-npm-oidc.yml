name: Publish npm with OIDC

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@a0853c245446d97795c9511ed39ef8be2e325c8f # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted-publishing support
        run: npm install --global npm@12.0.1
      - name: Verify generated package and publish provenance
        run: |
          set -euo pipefail
          mkdir package
          tar -xzf artifacts/stalelink-npm-package.tar.gz -C package
          test "$(node -p "require('./package/package.json').name")" = stalelink
          cd package/package
          npm publish --provenance
