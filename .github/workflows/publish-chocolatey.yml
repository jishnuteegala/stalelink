name: Publish Chocolatey package

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  # Allows re-publishing a single channel without re-running the whole
  # release pipeline (which is not idempotent past announce).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  credentials:
    runs-on: windows-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        shell: bash
        env:
          TOKEN: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: test -n "$TOKEN" && echo 'available=true' >> "$GITHUB_OUTPUT" || echo 'available=false' >> "$GITHUB_OUTPUT"
  publish:
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || fromJson(inputs.plan).announcement_tag }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Deliberately checks out the workflow's own ref (not the release tag)
      # so packaging-script fixes apply when re-publishing older tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release checksums
        shell: bash
        run: gh release download "$TAG" --repo jishnuteegala/stalelink --pattern sha256.sum --dir target/distrib
      - name: Generate, submit, and verify Chocolatey package
        shell: pwsh
        run: ./packaging/scripts/publish-chocolatey.ps1 -Version $env:TAG.TrimStart('v')
