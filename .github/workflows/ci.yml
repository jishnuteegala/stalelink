name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo package -p stalelink-core --no-verify
      - run: cargo package -p stalelink --list

  npm-installer:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2
        with:
          tool: cargo-dist
      - run: npm test

  dist-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2
        with:
          tool: cargo-dist
      - run: dist plan --output-format=json
      - run: dist generate --check
      - name: Assert cargo-dist artifact names
        run: dist plan --output-format=json | node packaging/scripts/test-dist-plan.js
      - name: Assert release-plz dispatch contract
        run: node packaging/scripts/test-release-dispatch.js

  distribution-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse workflow and package YAML
        run: ruby -ryaml -e 'ARGV.each { |path| YAML.load_file(path) }' $(git ls-files '*.yml' '*.yaml')
      - name: Validate distribution templates
        run: |
          set -euo pipefail
          bash packaging/scripts/test-channels.sh
      - name: Audit workflow action pins
        run: bash packaging/scripts/audit-workflow-action-shas.sh
      - name: Install verified nFPM
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf -o nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          printf '%s  %s\n' 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783 nfpm.tar.gz | sha256sum --check --strict
          tar -xzf nfpm.tar.gz nfpm
          chmod +x nfpm
      - name: Build all nFPM package formats and architectures
        run: bash packaging/scripts/test-nfpm.sh "$PWD/nfpm"
      - name: Note Arch validation boundary
        run: echo 'namcap requires an Arch environment; bash -n validates the rendered PKGBUILD here.'

  release-plz-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # PR checkouts are detached; release-plz needs a branch with an upstream.
      - run: |
          git checkout -B release-plz-dry-run
          git branch --set-upstream-to "origin/${GITHUB_BASE_REF:-main}" release-plz-dry-run
      - uses: MarcoIeni/release-plz-action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release
          version: 0.3.160
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
