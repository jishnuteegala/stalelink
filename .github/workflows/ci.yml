name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo package -p stalelink-core --no-verify
      - run: cargo package -p stalelink --list

  npm-installer:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2
        with:
          tool: cargo-dist
      - run: npm test

  dist-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2
        with:
          tool: cargo-dist
      - run: dist plan --output-format=json
      - run: dist generate --check

  distribution-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse workflow and package YAML
        run: ruby -ryaml -e 'ARGV.each { |path| YAML.load_file(path) }' $(git ls-files '*.yml' '*.yaml')
      - name: Validate distribution templates
        run: |
          set -euo pipefail
          test -f packaging/nfpm.yaml
          grep -q '^version: \${VERSION}$' packaging/nfpm.yaml
          sed -e 's/@VERSION@/0.1.0/g' -e 's/@SHA256@/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa/g' packaging/aur/PKGBUILD.template > PKGBUILD
          bash -n PKGBUILD
          node -e 'const manifest={version:"0.1.0",architecture:{"64bit":{url:"https://example.test/stalelink.zip",hash:"a".repeat(64)}},bin:"stalelink.exe"}; JSON.parse(JSON.stringify(manifest));'

  release-plz-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      # PR checkouts are detached; release-plz needs a branch with an upstream.
      - run: |
          git checkout -B release-plz-dry-run
          git branch --set-upstream-to "origin/${GITHUB_BASE_REF:-main}" release-plz-dry-run
      - uses: MarcoIeni/release-plz-action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release
          version: 0.3.160
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
