name: Publish WinGet manifest

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-22.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: test -n "$TOKEN" && echo 'available=true' >> "$GITHUB_OUTPUT" || echo 'available=false' >> "$GITHUB_OUTPUT"
  publish:
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    runs-on: windows-latest
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      GH_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
    steps:
      - name: Install pinned Komac
        shell: pwsh
        run: |
          $asset = "komac-2.11.0-x86_64-pc-windows-msvc.exe"
          Invoke-WebRequest "https://github.com/russellbanks/Komac/releases/download/v2.11.0/$asset" -OutFile "$env:RUNNER_TEMP\komac.exe"
          if ((Get-FileHash "$env:RUNNER_TEMP\komac.exe" -Algorithm SHA256).Hash -ne "9B7B4504A2B469D4791DAC3295350BED4EE13C385340438D396EC9948B25FB12") { throw "Komac checksum mismatch" }
          & "$env:RUNNER_TEMP\komac.exe" --version
      - name: Submit manifest pull request
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          $x64Url = "https://github.com/jishnuteegala/stalelink/releases/download/$env:TAG/stalelink-x86_64-pc-windows-msvc.zip"
          $arm64Url = "https://github.com/jishnuteegala/stalelink/releases/download/$env:TAG/stalelink-aarch64-pc-windows-msvc.zip"
          $log = & "$env:RUNNER_TEMP\komac.exe" update jishnuteegala.stalelink --version $version --urls $x64Url $arm64Url --submit --token $env:GH_TOKEN 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -ne 0) {
            if ($log -match 'does not exist in microsoft/winget-pkgs') {
              # komac update only works for existing packages; the first manifest
              # must be bootstrapped interactively with `komac new` or a manual PR.
              Write-Host "::warning::jishnuteegala.stalelink is not in winget-pkgs yet. Bootstrap the first manifest manually (komac new jishnuteegala.stalelink), then future releases will submit update PRs automatically."
              exit 0
            }
            exit $LASTEXITCODE
          }
