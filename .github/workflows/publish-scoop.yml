name: Publish Scoop manifest

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-22.04
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.PACKAGES_GITHUB_TOKEN }}
        run: test -n "$TOKEN" && echo 'available=true' >> "$GITHUB_OUTPUT" || echo 'available=false' >> "$GITHUB_OUTPUT"
  publish:
    needs: credentials
    if: needs.credentials.outputs.available == 'true'
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
      GH_TOKEN: ${{ secrets.PACKAGES_GITHUB_TOKEN }}
    steps:
      - name: Generate and push manifest
        run: |
          set -euo pipefail
          version="${TAG#v}"
          asset="stalelink-x86_64-pc-windows-msvc.zip"
          url="https://github.com/jishnuteegala/stalelink/releases/download/${TAG}/${asset}"
          checksum_file="$(gh release view "$TAG" --repo jishnuteegala/stalelink --json assets --jq '.assets[].name | select(test("(?i)(sha256|checksum)"))' | head -n1)"
          test -n "$checksum_file"
          gh release download "$TAG" --repo jishnuteegala/stalelink --pattern "$checksum_file" --dir . >/dev/null
          sha256="$(awk -v asset="$asset" '$2 ~ asset { print $1 }' "$checksum_file")"
          test -n "$sha256"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/jishnuteegala/scoop-bucket.git" bucket
          VERSION="$version" URL="$url" SHA256="$sha256" node -e 'const fs=require("fs"); fs.writeFileSync("bucket/stalelink.json", JSON.stringify({version:process.env.VERSION,description:"Find dead and outdated links in local documents.",homepage:"https://github.com/jishnuteegala/stalelink",license:"MIT",architecture:{"64bit":{url:process.env.URL,hash:process.env.SHA256}},bin:"stalelink.exe"},null,2)+"\n")'
          git -C bucket config user.name github-actions[bot]
          git -C bucket config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C bucket add stalelink.json
          git -C bucket commit -m "stalelink ${version}"
          git -C bucket push
