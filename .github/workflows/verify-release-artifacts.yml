name: Verify release artifacts

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  checksums:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Check artifacts against sha256.sum
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          set -euo pipefail
          source packaging/scripts/channel-lib.sh
          verify_release_artifacts artifacts "${PLAN:?}"
  smoke:
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: artifacts
      - name: Run the built binary
        if: contains(matrix.targets, matrix.host)
        shell: bash
        env:
          EXPECTED: stalelink ${{ fromJson(inputs.plan).releases[0].app_version }}
        run: |
          set -euo pipefail
          archive="$(find artifacts -maxdepth 1 -type f \( -name '*.tar.xz' -o -name '*.zip' \) -print -quit)"
          test -n "$archive"
          mkdir unpack
          case "$archive" in
            *.zip) pwsh -NoProfile -Command "Expand-Archive -LiteralPath '$archive' -DestinationPath unpack" ;;
            *) tar -xJf "$archive" -C unpack ;;
          esac
          binary="$(find unpack -type f \( -name stalelink -o -name stalelink.exe \) -print -quit)"
          test -n "$binary"
          actual="$("$binary" --version | tr -d '\r')"
          test "$actual" = "$EXPECTED" || { echo "::error::$archive: expected '$EXPECTED', got '$actual'"; exit 1; }
