name: Release PR

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Never run two release-plz invocations at once; a race could double-tag.
concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: MarcoIeni/release-plz-action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release-pr
          version: 0.3.160
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: release-pr
    # `release` is a no-op except when the merged release PR is present.
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: MarcoIeni/release-plz-action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        id: release-plz
        with:
          command: release
          version: 0.3.160
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tags created with GITHUB_TOKEN never fire push-triggered workflows
      # (recursive-trigger protection), so dispatch cargo-dist explicitly using
      # the tag release-plz reports rather than inferring it from git state.
      - name: Start cargo-dist for the release tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          tag="$(jq -r '.[0].tag' <<< "$RELEASES")"
          gh workflow run release.yml --ref "$tag" -f tag="$tag"
