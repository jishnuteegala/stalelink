name: Publish nFPM packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64
    env:
      NFPM_VERSION: v2.47.0
      NFPM_ARCHIVE: nfpm_2.47.0_Linux_x86_64.tar.gz
      NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Install pinned nFPM
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/${NFPM_ARCHIVE}"
          printf '%s  %s\n' "$NFPM_SHA256" nfpm.tar.gz | sha256sum --check --strict
          tar -xzf nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version
      - name: Package Linux binary and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          archive="stalelink-${{ matrix.target }}.tar.xz"
          test -f "artifacts/$archive"
          mkdir unpack "out/${{ matrix.arch }}"
          tar -xJf "artifacts/$archive" -C unpack
          binary="$(find unpack -type f -name stalelink -print -quit)"
          test -n "$binary"
          source packaging/scripts/nfpm-lib.sh
          build_nfpm_packages nfpm packaging/nfpm.yaml "$binary" "out/${{ matrix.arch }}" "$version" "${{ matrix.arch }}"
          sha256sum "out/${{ matrix.arch }}"/* > "out/stalelink-${version}-${{ matrix.arch }}-linux-packages.sha256"
          gh release upload "$TAG" "out/${{ matrix.arch }}"/* "out/stalelink-${version}-${{ matrix.arch }}-linux-packages.sha256" --clobber
