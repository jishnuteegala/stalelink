version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    # cargo-dist generates release.yml; its action pins live in Cargo.toml github-action-commits.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: gomod
    directory: /bench/go-port
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
